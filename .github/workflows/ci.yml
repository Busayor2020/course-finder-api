name: CI

on:
  push:
  pull_request:

# Read-only token: this workflow only checks code, it never writes to the repo.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      # setup-python pins the interpreter, so the runner's Ubuntu version
      # doesn't need to match the server's.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      # Tests use in-memory SQLite (TestConfig), so no MySQL service is needed.
      - name: Test
        run: pytest -q
