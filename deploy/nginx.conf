# Nginx site for Course Finder. Installed to /etc/nginx/sites-available/course-finder
# by deploy/setup.sh. Nginx faces the internet; Gunicorn sits behind it on a unix socket.

# Rate limiting for the API: 10 requests per second per client IP, tracked in 10 MB
# of shared memory (about 160,000 IPs). This file is included inside Nginx's http
# block, which is where this directive must live.
limit_req_zone $binary_remote_addr zone=course_finder_api:10m rate=10r/s;

upstream course_finder {
    # fail_timeout=0: always retry the socket rather than marking it down.
    server unix:/run/course-finder/gunicorn.sock fail_timeout=0;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    # On a VPS with a domain: server_name course-finder.example.com;
    server_name _;

    # Don't advertise the Nginx version in headers and error pages.
    server_tokens off;

    # The API is read-only, so no request ever needs a large body.
    client_max_body_size 1m;

    access_log /var/log/nginx/course-finder.access.log;
    error_log /var/log/nginx/course-finder.error.log;

    # Compress text responses; JSON lists compress very well.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/json text/css text/javascript application/javascript;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Passed to Gunicorn so Flask sees the real client IP and scheme.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;
    proxy_connect_timeout 5s;
    # Slightly longer than Gunicorn's 30 s timeout, so Gunicorn gives up first.
    proxy_read_timeout 35s;

    # Static files are served by Nginx directly and never touch Python.
    location /static/ {
        alias /srv/course-finder/app/static/;
        # Short cache: file names carry no version hash, so a long cache would
        # keep serving old JavaScript after a deploy.
        expires 1h;
        access_log off;
    }

    location /api/ {
        # Allow short bursts (a page load plus a few quick searches), then answer 429.
        limit_req zone=course_finder_api burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://course_finder;
    }

    location / {
        proxy_pass http://course_finder;
    }

    # Rate-limited clients get the API's usual JSON error envelope, not an HTML page.
    error_page 429 = @rate_limited;
    location @rate_limited {
        default_type application/json;
        return 429 '{"error": {"code": "rate_limited", "message": "Too many requests. Please slow down and try again.", "details": {}}}';
    }
}
